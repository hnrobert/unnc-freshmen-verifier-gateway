services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/app.db
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Optional cold-start seed for background-email links. The canonical origin
      # is otherwise inferred from observed visitor traffic (see siteOrigin.ts).
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
