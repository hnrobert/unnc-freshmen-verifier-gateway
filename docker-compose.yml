services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      # Expose the host timezone so the server resolves its local zone (the
      # default reminder timezone). /etc/timezone (plain text) is read directly
      # by resolveServerTz(); /etc/localtime backs Intl offsets / log timestamps.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/app.db
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      # Optional cold-start seed for background-email links. The canonical origin
      # is otherwise inferred from observed visitor traffic (see siteOrigin.ts).
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
